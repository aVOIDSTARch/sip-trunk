[workspace]
resolver = "3"
members = [
    "sip-logger",
    "sip-trunk-core",
    "sip-trunk-server",
    "sip-trunk-api",
    "sip-trunk-cli",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.8", features = ["macros"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error types
thiserror = "2"
anyhow = "1"

# .env loading
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Crypto for Telnyx signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# UUIDs
uuid = { version = "1", features = ["v4"] }

# HTTP middleware
tower-http = { version = "0.6", features = ["trace"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Internal workspace crates
sip-logger = { path = "sip-logger" }
sip-trunk-core = { path = "sip-trunk-core" }
