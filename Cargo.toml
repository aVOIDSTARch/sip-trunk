[package]
name = "sip-trunk"
version = "0.1.0"
edition = "2024"

[dependencies]
sip-logger = { workspace = true }
sip-trunk-server = { path = "sip-trunk-server" }
sip-trunk-api = { path = "sip-trunk-api" }
tokio = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }

[workspace]
resolver = "3"
members = [
    "sip-logger",
    "sip-trunk-core",
    "sip-trunk-server",
    "sip-trunk-api",
    "sip-trunk-cli",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.8", features = ["macros"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error types
thiserror = "2"
anyhow = "1"

# .env loading
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Ed25519 signature verification (Telnyx webhooks)
ed25519-dalek = "2"
base64 = "0.22"

# Testing utilities (used in [dev-dependencies] of member crates)
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP middleware
tower-http = { version = "0.6", features = ["trace"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Internal workspace crates
sip-logger = { path = "sip-logger" }
sip-trunk-core = { path = "sip-trunk-core" }
